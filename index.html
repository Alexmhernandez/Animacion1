<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eres muy importante para mí</title>
  
  <!-- Librería externa para el efecto de confeti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    /* Estilos Generales */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fdf8f4;
      color: #4a3e3d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
      overflow-x: hidden;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 25px;
      color: #2c2c2c;
      max-width: 90%;
      line-height: 1.4;
    }

    /* Lista animada */
    .reasons-list {
      list-style: none;
      padding: 0;
      margin: 0 0 20px 0;
    }

    .reasons-list li {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 12px 0;
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.8s ease-in-out;
    }

    .reasons-list li.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .sub-text {
      font-size: 1.2rem;
      font-weight: 500;
      color: #7d5260;
      margin-top: 15px;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .sub-text.visible {
      opacity: 1;
    }

    .highlight-text {
      font-size: 1.35rem;
      font-weight: bold;
      color: #c2185b;
      margin-top: 10px;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .highlight-text.visible {
      opacity: 1;
    }

    /* --- Contenedor del Ramo de Rosas --- */
    .rose-bouquet-container {
      width: 200px;
      height: 250px;
      position: relative;
      margin-top: 20px;
      cursor: pointer;
    }

    /* Maceta Común */
    .pot {
      width: 100px;
      height: 70px;
      background: #c86d51;
      position: absolute;
      bottom: 0;
      left: 50px;
      border-radius: 5px 5px 15px 15px;
      box-shadow: inset 0 -5px 0 rgba(0,0,0,0.1);
      z-index: 10;
    }

    /* Tallos individuales */
    .stem {
      width: 8px;
      height: 0px; /* Crece con JS */
      background: #4caf50;
      position: absolute;
      bottom: 65px;
      border-radius: 4px;
      transition: height 1.5s ease-in-out;
    }

    /* Posiciones de los tallos */
    .stem-1 { left: 75px; transform: rotate(-15deg); transform-origin: bottom center; }
    .stem-2 { left: 96px; }
    .stem-3 { left: 117px; transform: rotate(15deg); transform-origin: bottom center; }

    /* --- Estructura de la Rosa Roja --- */
    .rose-head {
      width: 50px;
      height: 50px;
      position: absolute;
      transform: scale(0); /* Crece con JS */
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Posiciones de los capullos de rosa */
    .rose-1 { top: 35px; left: 50px; }
    .rose-2 { top: 15px; left: 75px; }
    .rose-3 { top: 35px; left: 100px; }

    .rose-petal {
      position: absolute;
      background: #d32f2f;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    }

    /* Capas de pétalos para dar efecto de rosa */
    .r-outer { width: 44px; height: 44px; top: 3px; left: 3px; background: #c62828; }
    .r-mid { width: 30px; height: 30px; top: 10px; left: 10px; background: #e53935; }
    .r-inner { width: 18px; height: 18px; top: 16px; left: 16px; background: #ff5252; border-radius: 50%; }

  </style>
</head>
<body>

  <h1>Quiero que sepas que eres muy importante para mí porque...</h1>

  <ul class="reasons-list">
    <li>Eres Hermosa</li>
    <li>Eres Divertida</li>
    <li>Eres mi pequeñita hermosa</li>
    <li>Eres auténtica</li>
  </ul>

  <p class="sub-text" id="subText">pero sobre todo...</p>
  <p class="highlight-text" id="finalText">¡porque eres MÍA, no olvides que me encantas bb!</p>

  <!-- Ramo de Rosas Rojas -->
  <div class="rose-bouquet-container" onclick="lanzarConfeti()">
    
    <!-- Tallos -->
    <div class="stem stem-1" id="stem1"></div>
    <div class="stem stem-2" id="stem2"></div>
    <div class="stem stem-3" id="stem3"></div>

    <!-- Capullos de Rosa -->
    <div class="rose-head rose-1" id="rose1">
      <div class="rose-petal r-outer"></div>
      <div class="rose-petal r-mid"></div>
      <div class="rose-petal r-inner"></div>
    </div>
    <div class="rose-head rose-2" id="rose2">
      <div class="rose-petal r-outer"></div>
      <div class="rose-petal r-mid"></div>
      <div class="rose-petal r-inner"></div>
    </div>
    <div class="rose-head rose-3" id="rose3">
      <div class="rose-petal r-outer"></div>
      <div class="rose-petal r-mid"></div>
      <div class="rose-petal r-inner"></div>
    </div>

    <!-- Maceta -->
    <div class="pot"></div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const items = document.querySelectorAll('.reasons-list li');
      const subText = document.getElementById('subText');
      const finalText = document.getElementById('finalText');
      
      const stems = [document.getElementById('stem1'), document.getElementById('stem2'), document.getElementById('stem3')];
      const roses = [document.getElementById('rose1'), document.getElementById('rose2'), document.getElementById('rose3')];

      // 1. Mostrar las razones una a una
      items.forEach((item, index) => {
        setTimeout(() => {
          item.classList.add('visible');
        }, (index + 1) * 800); // 800ms de pausa entre cada frase
      });

      const totalListTime = (items.length + 1) * 800;

      // 2. Mostrar el texto "pero sobre todo..."
      setTimeout(() => {
        subText.classList.add('visible');
      }, totalListTime);

      // 3. Mostrar el texto final
      setTimeout(() => {
        finalText.classList.add('visible');
      }, totalListTime + 1000);

      // 4. Hacer crecer los tallos
      setTimeout(() => {
        stems.forEach(stem => stem.style.height = '120px');
      }, totalListTime + 1800);

      // 5. Florecer las tres rosas rojas + lanzar confeti
      setTimeout(() => {
        roses.forEach(rose => rose.style.transform = 'scale(1)');
        lanzarConfeti();
      }, totalListTime + 3000);
    });

    // Función de confeti
    function lanzarConfeti() {
      confetti({
        particleCount: 120,
        spread: 90,
        origin: { y: 0.6 }
      });
    }
  </script>
</body>
</html>
